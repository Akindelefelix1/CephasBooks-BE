services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cephas
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: cephas_books
    ports:
      - "5432:5432"
    volumes:
      - cephas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cephas -d cephas_books"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cephas_postgres:
